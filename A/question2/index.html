<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 2 - Smart Number Validator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
    }

    #result {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>

<body>
  <h1>Smart Number Validator</h1>

  <label for="userInput">Enter a number:</label>

  <p id="result" role="status" aria-live="polite"></p>
</body>
